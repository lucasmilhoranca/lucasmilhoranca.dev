# Security headers, shared by every response.
#
# nginx REPLACES inherited add_header directives instead of merging them, so
# this file has to be included again inside any location that adds its own
# header (see the asset location in nginx.conf).
#
# HSTS: no includeSubDomains on purpose — it would force HTTPS in the browser
# for every *.lucasmilhoranca.dev too, including anything else hosted on the
# VPS that is still served over plain HTTP. Add it once every subdomain has a
# valid certificate. No `preload` either: that one is effectively irreversible.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Every browser feature the site does not use, switched off.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=(), interest-cohort=()" always;

# Content-Security-Policy — generated at build time by scripts/csp.mjs.
include /etc/nginx/snippets/csp.conf;
