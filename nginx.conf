server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml font/woff2;

    error_page 404 /404.html;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:woff2|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # add_header above drops the inherited ones — re-add them here.
        include /etc/nginx/snippets/security-headers.conf;
    }
}
