apiVersion: apps/v1
kind: Deployment
metadata:
  name: lucasmilhoranca-dev
  namespace: lucasmilhoranca-dev
  labels:
    app: lucasmilhoranca-dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: lucasmilhoranca-dev
  template:
    metadata:
      labels:
        app: lucasmilhoranca-dev
    spec:
      containers:
        - name: web
          # CI overwrites this tag on every deploy (kubectl set image) — the
          # value here only matters for the very first manual `kubectl apply`.
          image: ghcr.io/lucasmilhoranca/lucasmilhoranca.dev:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
