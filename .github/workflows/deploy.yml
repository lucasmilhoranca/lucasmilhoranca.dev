name: Deploy

# Push-only, on purpose. The `deploy` job below runs on a self-hosted runner
# (your VPS, with Docker access). Self-hosted runners must NEVER be used with
# a `pull_request` trigger on a public repo — anyone could open a PR and get
# their workflow code executed on your VPS. `push` to a specific branch is
# safe because only people with write access to this repo can push to it in
# the first place.
on:
  push:
    branches:
      - release/production

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        run: |
          docker compose pull
          docker compose up -d --force-recreate

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APP: lucasmilhoranca.dev
          SITE: https://lucasmilhoranca.dev
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set — skipping Discord notification."
            exit 0
          fi

          if [ "$DEPLOY_RESULT" = "success" ]; then
            TITLE="✅ $APP deployed to production"
            COLOR=3066993   # green
          elif [ "$BUILD_RESULT" != "success" ]; then
            TITLE="❌ $APP build failed — nothing deployed"
            COLOR=15158332  # red
          else
            TITLE="❌ $APP deploy failed — image built, container not updated"
            COLOR=15158332  # red
          fi

          SUMMARY=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-7)

          jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg site "$SITE" \
            --arg summary "$SUMMARY" \
            --arg sha "$SHORT_SHA" \
            --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" \
            --arg commit_url "$COMMIT_URL" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: "Deploy",
              embeds: [{
                title: $title,
                url: $site,
                color: $color,
                description: ("[`" + $sha + "`](" + $commit_url + ") " + $summary),
                fields: [
                  { name: "Author", value: $actor, inline: true },
                  { name: "Workflow", value: ("[run log](" + $run_url + ")"), inline: true }
                ],
                timestamp: $ts
              }]
            }' > payload.json

          curl -sS --fail-with-body \
            -X POST \
            -H 'Content-Type: application/json' \
            --data @payload.json \
            "$DISCORD_WEBHOOK_URL"
